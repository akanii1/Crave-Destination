<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Crust: The Pizza You Can Hold!</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Animated background -->
<div class="bg"><div class="dots"></div><div class="blob b1"></div><div class="blob b2"></div><div id="crumbs"></div></div>

<!-- Page skeleton. The content of each block is filled from content.js -->
<nav id="nav"></nav>

<header id="top" class="hero"><div class="wrap g2" id="hero"></div></header>

<main>
  <section id="about"><div class="wrap" id="special"></div></section>

  <div class="marquee"><div id="marq"></div></div>

  <section class="s-choc center" style="padding:5rem 0"><div class="wrap" id="banner"></div></section>

  <section id="customer-love"><div class="wrap" id="customers"></div></section>

  <section id="product-details" class="s-choc center"><div class="wrap" id="product"></div></section>

  <section id="about-us" class="s-brown center"><div class="wrap" id="aboutus"></div></section>

  <section id="business-permit"><div class="wrap center" id="permits"></div></section>
</main>

<footer id="footer"></footer>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
